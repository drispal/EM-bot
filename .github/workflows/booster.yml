name: Open Essec Masters booster

on:
  workflow_dispatch:

concurrency:
  group: booster
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open booster
        id: booster
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
        run: python open_booster.py

      - name: Market (mode test, lecture seule)
        if: steps.booster.outputs.opened == 'true'
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
        run: python market_bot.py
