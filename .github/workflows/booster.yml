name: Open Essec Masters booster

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Marché : "true" = simulation, "false" = actions réelles, vide = variable MARKET_DRY_RUN'
        required: false
        default: ""
      min_ratio:
        description: 'Marché : points par essecoin minimum (test), vide = variable MARKET_MIN_RATIO ou 0.125'
        required: false
        default: ""
      probe:
        description: '"true" = sonde en lecture seule du marché (aucun autre job ne tourne)'
        required: false
        default: ""

      inspect:
        description: '"true" = lecture seule de mon compte (album, échanges, activité, pages choisies) ; aucun autre job ne tourne'
        required: false
        default: ""
      paths:
        description: 'inspect : chemins supplémentaires à lire (séparés par des espaces), ex. "/friends /market/trades"'
        required: false
        default: ""

jobs:
  inspect:
    if: ${{ inputs.inspect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Debug opening
        if: ${{ inputs.paths == 'debug-open' }}
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
        run: |
          for h in brunhild.challenges.cloudflare.com hagen.challenges.cloudflare.com challenges.cloudflare.com; do
            echo "== $h"
            echo "A    : $(getent ahostsv4 $h | awk '{print $1}' | sort -u | tr '\n' ' ')"
            echo "AAAA : $(getent ahostsv6 $h | awk '{print $1}' | sort -u | tr '\n' ' ')"
            echo "curl -4: $(curl -4 -s -o /dev/null -m 8 -w '%{http_code}' https://$h/ 2>&1) | curl -6: $(curl -6 -s -o /dev/null -m 8 -w '%{http_code}' https://$h/ 2>&1)"
            echo "curl -4 -v: $(curl -4 -sv -o /dev/null -m 8 https://$h/ 2>&1 | grep -E 'Connected|timed|refused|SSL|HTTP/' | head -3 | tr '\n' ';')"
          done
          echo "IPv6 route: $(ip -6 route 2>&1 | head -2 | tr '\n' ';')"
          for m in none; do
            echo "########## MODE $m"
            if [ "$m" = "headed" ] || [ "$m" = "headed-flags" ]; then
              MODE=$m xvfb-run -a python debug_open.py || true
            else
              MODE=$m python debug_open.py || true
            fi
          done
      - name: Captures
        if: ${{ always() && inputs.paths == 'debug-open' }}
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shot-*.png
      - name: Inspect my account (read-only)
        if: ${{ inputs.paths != 'debug-open' }}
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
          INSPECT_PATHS: ${{ inputs.paths }}
        run: python inspect_account.py

  probe:
    if: ${{ inputs.probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Probe market (read-only)
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
          PROBE_LIMIT: "100"
        run: python probe.py

  open:
    if: ${{ inputs.probe != 'true' && inputs.inspect != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # branche tracking : solde de Joss (lu) et annonce appât (écrite)
    concurrency:
      group: booster-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Open booster
        id: booster
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
        run: python open_booster.py

      - name: Tracking branch
        continue-on-error: true
        run: .github/scripts/tracking.sh setup

      # Mémoire des annonces créées par le bot (sert à recycler après le délai)
      - name: Restore sell state
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: sell_state.json
          key: sell-state-${{ github.run_id }}
          restore-keys: sell-state-

      - name: Market (sell/recycle duplicates, buy missing cards)
        id: market
        if: ${{ !cancelled() }}  # à chaque passage, qu'un booster ait été ouvert ou non
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
          # Simulation tant que la variable MARKET_DRY_RUN n'est pas "false"
          DRY_RUN: ${{ inputs.dry_run || vars.MARKET_DRY_RUN || 'true' }}
          # Mise en vente réelle des rares : MARKET_SELL_DRY_RUN = "false" (en plus de MARKET_DRY_RUN)
          SELL_DRY_RUN: ${{ vars.MARKET_SELL_DRY_RUN || 'true' }}
          # Points par essecoin minimum pour acheter (commune 1 pt, rare 3, épique 8)
          MIN_RATIO: ${{ inputs.min_ratio || vars.MARKET_MIN_RATIO || '0.125' }}
          # Compte nourrisseur (Joss) : échanges et annonce appât simulés tant que LINK_DRY_RUN != "false"
          LINK_DRY_RUN: ${{ vars.LINK_DRY_RUN || 'true' }}
          TRACK_DIR: data
          FEEDER_NAME: ${{ vars.FEEDER_NAME || 'Josserand' }}
        run: python market.py

      - name: Save link state
        if: always() && github.ref_name == 'main'
        continue-on-error: true
        run: .github/scripts/tracking.sh push "Link state" bait.json

      - name: Save sell state
        if: always() && steps.market.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: sell_state.json
          key: sell-state-${{ github.run_id }}-${{ github.run_attempt }}

  auctions:
    if: ${{ inputs.probe != 'true' && inputs.inspect != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write  # pour ajouter les instantanés du classement sur la branche tracking
    concurrency:
      group: auctions-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Suivi du classement : top 3 (points, cartes) au plus toutes les 30 min, dans
      # leaderboard.csv sur la branche "tracking" (lecture : python leaderboard.py --report)
      - name: Leaderboard snapshot
        id: lb
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
          TRACK_CSV: data/leaderboard.csv
        run: |
          git fetch --depth=1 origin +refs/heads/tracking:refs/remotes/origin/tracking 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/tracking; then
            git worktree add -B tracking data origin/tracking
          else
            git worktree add --orphan -b tracking data
          fi
          python leaderboard.py

      - name: Save leaderboard snapshot
        if: always() && steps.lb.outputs.changed == 'true' && github.ref_name == 'main'
        continue-on-error: true
        working-directory: data
        run: |
          git config user.name "em-bot"
          git config user.email "em-bot@users.noreply.github.com"
          git add leaderboard.csv REPORT.md
          git commit -q -m "Leaderboard snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git push origin HEAD:tracking && break
            git pull -q --rebase origin tracking
          done

      - name: Auctions (minimum bid in the last minute)
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE }}
          # Simulation tant que la variable MARKET_AUCTION_DRY_RUN n'est pas "false"
          AUCTION_DRY_RUN: ${{ vars.MARKET_AUCTION_DRY_RUN || 'true' }}
        run: python auctions.py

  # Compte nourrisseur (Joss) : booster, échanges reçus, annonce appât, recyclage des doublons.
  # Ne tourne que si la variable FEEDER_ENABLED vaut "true" et si le secret ESSEC_STORAGE_STATE_JOSS existe.
  feeder:
    if: ${{ vars.FEEDER_ENABLED == 'true' && inputs.probe != 'true' && inputs.inspect != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # branche tracking : solde de Joss (écrit), annonce appât (lue)
    concurrency:
      group: feeder-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Tracking branch
        continue-on-error: true
        run: .github/scripts/tracking.sh setup

      - name: Open booster (Joss)
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE_JOSS }}
        run: python open_booster.py

      - name: Restore sell state (Joss)
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: sell_state_joss.json
          key: sell-state-joss-${{ github.run_id }}
          restore-keys: sell-state-joss-

      - name: Trades and bait (Joss)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE_JOSS }}
          FEEDER_DRY_RUN: ${{ vars.FEEDER_DRY_RUN || 'true' }}
          FEEDER_MAIN_NAME: ${{ vars.FEEDER_MAIN_NAME }}
          TRACK_DIR: data
        run: python feeder.py

      - name: "Market (Joss: sell/recycle duplicates only)"
        id: market
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ESSEC_STORAGE_STATE: ${{ secrets.ESSEC_STORAGE_STATE_JOSS }}
          FEEDER: "true"
          DRY_RUN: ${{ vars.FEEDER_DRY_RUN || 'true' }}
          SELL_DRY_RUN: ${{ vars.FEEDER_DRY_RUN || 'true' }}
          SELL_STATE_FILE: sell_state_joss.json
        run: python market.py

      - name: Save sell state (Joss)
        if: always() && steps.market.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: sell_state_joss.json
          key: sell-state-joss-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Joss balance
        if: always() && github.ref_name == 'main'
        continue-on-error: true
        run: .github/scripts/tracking.sh push "Feeder balance" feeder.json
