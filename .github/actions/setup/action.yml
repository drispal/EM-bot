name: Setup Python and Playwright
description: Python, Playwright and Chromium (browser cached between runs)
inputs:
  chrome:
    description: "Installer aussi Google Chrome (ouverture des boosters : contrôle Turnstile)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Playwright
      shell: bash
      run: pip install -r requirements.txt

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

    # Les paquets système (apt) de Chromium viennent parfois d'un miroir très lent
    # (4 min 30 observées) : on garde les .deb téléchargés d'un run à l'autre.
    - name: Runner image version
      id: img
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: apt-${{ runner.os }}-${{ steps.img.outputs.version }}-${{ hashFiles('requirements.txt') }}

    - name: Install Chromium
      shell: bash
      run: |
        mkdir -p ~/apt-debs
        sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        echo "apt : $(ls ~/apt-debs | wc -l) paquet(s) en cache"
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          playwright install-deps chromium
        else
          playwright install --with-deps chromium
        fi
        sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
        sudo chown -R "$USER" ~/apt-debs 2>/dev/null || true
        echo "apt : $(ls ~/apt-debs | wc -l) paquet(s) conservés"

    # Le contrôle anti-robot du site (Cloudflare Turnstile) n'aboutit qu'avec un vrai Chrome,
    # affiché (sous écran virtuel xvfb) : Chromium headless est refusé.
    - name: Install Google Chrome
      if: ${{ inputs.chrome == 'true' }}
      shell: bash
      run: |
        sudo -E env "PATH=$PATH" playwright install chrome || python -m playwright install chrome
        sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
